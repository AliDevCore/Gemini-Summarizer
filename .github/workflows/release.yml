name: Build and Auto-Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Verify Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p keystore
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore/release.jks
            echo "Release keystore decoded from secret."
          elif [ -f "keystore/release.jks" ]; then
            echo "Release keystore found in repository."
          else
            echo "Warning: No release keystore found."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME="1.0.${{ github.run_number }}" --stacktrace

      - name: Determine Release Tag
        id: tag_generator
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git tag $TAG_NAME
            git push origin $TAG_NAME || echo "Tag already exists or push skipped"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-artifacts/Gemini-Summarizer-${{ steps.tag_generator.outputs.TAG_NAME }}.apk \;
          cd release-artifacts
          sha256sum *.apk > checksums.sha256
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Summarizer-APK-${{ steps.tag_generator.outputs.TAG_NAME }}
          path: release-artifacts/*

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_generator.outputs.TAG_NAME }}
          name: "Release ${{ steps.tag_generator.outputs.TAG_NAME }}"
          body: |
            ### 🚀 Gemini Summarizer Official Release
            
            - **Release Tag:** `${{ steps.tag_generator.outputs.TAG_NAME }}`
            - **Version Code:** `${{ github.run_number }}`
            - **Asset:** Standalone signed Android installable APK (`Gemini-Summarizer-${{ steps.tag_generator.outputs.TAG_NAME }}.apk`)
            
            #### Highlights:
            - **Robust Architecture:** Complete hardening across API ingestion, Jsoup web scraper, and multi-page export.
            - **Persistent Signature:** Signed with the official project release certificate for seamless in-place updates.
            - **Updated Models:** Gemini 3.1 Pro Preview, Gemini 3 Flash Preview, Gemini 3.8 Flash, Gemini 3.5 Flash, and Gemini 3.5 Flash-Lite.
            - **Direct API Keys:** Streamlined direct API key pool management.
            - **Refined Material 3 UI:** Fixed text wrapping, button clipping, and per-paragraph RTL rendering.
          files: |
            release-artifacts/*.apk
            release-artifacts/checksums.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
