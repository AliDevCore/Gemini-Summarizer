name: Build and Auto-Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME="1.0.${{ github.run_number }}" --stacktrace

      - name: Determine Release Tag
        id: tag_generator
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git tag $TAG_NAME
            git push origin $TAG_NAME || echo "Tag already exists or push skipped"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-artifacts/Gemini-Summarizer-${{ steps.tag_generator.outputs.TAG_NAME }}.apk \;

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_generator.outputs.TAG_NAME }}
          name: "Release ${{ steps.tag_generator.outputs.TAG_NAME }}"
          body: |
            ### 🚀 Gemini Summarizer Official Release
            
            - **Release Tag:** `${{ steps.tag_generator.outputs.TAG_NAME }}`
            - **Version Code:** `${{ github.run_number }}`
            - **Asset:** Standalone signed Android installable APK (`Gemini-Summarizer-${{ steps.tag_generator.outputs.TAG_NAME }}.apk`)
            
            #### Highlights:
            - **Persistent Signature:** Signed with the official project release certificate for seamless in-place updates without data loss.
            - **Updated Models:** Gemini 3.1 Pro Preview, Gemini 3 Flash Preview, Gemini 3.8 Flash, Gemini 3.5 Flash, and Gemini 3.5 Flash-Lite.
            - **Direct API Keys:** Streamlined direct API key pool management.
            - **Refined Material 3 UI:** Fixed text wrapping and button clipping across all screen sizes.
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
