name: Build and Auto-Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (optional, defaults to auto-incremented v1.0.X)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Next Version and Tag
        id: tag_generator
        run: |
          manual_tag="${{ inputs.tag_name }}"
          if [ -n "$manual_tag" ]; then
            TAG_NAME="$manual_tag"
            VERSION_CODE=100
            VERSION_NAME="${TAG_NAME#v}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION_CODE=100
            VERSION_NAME="${TAG_NAME#v}"
          else
            git fetch --tags --force || true
            highest_patch=0
            for t in $(git tag -l "v1.0.*"); do
              if [[ $t =~ ^v1\.0\.([0-9]+)$ ]]; then
                num="${BASH_REMATCH[1]}"
                if [ "$num" -gt "$highest_patch" ]; then
                  highest_patch=$num
                fi
              fi
            done
            run_num="${{ github.run_number }}"
            next_patch=$(( highest_patch + 1 ))
            if [ "$run_num" -gt "$next_patch" ]; then
              next_patch=$run_num
            fi
            TAG_NAME="v1.0.$next_patch"
            VERSION_CODE=$next_patch
            VERSION_NAME="1.0.$next_patch"
          fi
          echo "Target Tag: $TAG_NAME"
          echo "Version Name: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Create and Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tag_generator.outputs.TAG_NAME }}" -m "Release ${{ steps.tag_generator.outputs.TAG_NAME }}" || true
          git push origin "${{ steps.tag_generator.outputs.TAG_NAME }}" || true

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Verify Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p keystore
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore/release.jks
            echo "Release keystore decoded from secret."
          elif [ -f "keystore/release.jks" ]; then
            echo "Release keystore found in repository."
          else
            echo "Warning: No release keystore found, falling back to debug signing."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'gemini_summarizer_secure_keystore_2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'gemini_key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'gemini_summarizer_secure_keystore_2026' }}
        run: |
          ./gradlew assembleRelease \
            -PVERSION_CODE=${{ steps.tag_generator.outputs.VERSION_CODE }} \
            -PVERSION_NAME="${{ steps.tag_generator.outputs.VERSION_NAME }}" \
            --stacktrace

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-artifacts/Gemini-Summarizer-${{ steps.tag_generator.outputs.TAG_NAME }}.apk \;
          cd release-artifacts
          sha256sum *.apk > checksums.sha256
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Summarizer-APK-${{ steps.tag_generator.outputs.TAG_NAME }}
          path: release-artifacts/*

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_generator.outputs.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: "Gemini Summarizer ${{ steps.tag_generator.outputs.TAG_NAME }}"
          generate_release_notes: true
          body: |
            ### 🚀 Gemini Summarizer Official Release (${{ steps.tag_generator.outputs.TAG_NAME }})
            
            - **Release Tag:** `${{ steps.tag_generator.outputs.TAG_NAME }}`
            - **Version Code:** `${{ steps.tag_generator.outputs.VERSION_CODE }}`
            - **Asset:** Standalone signed Android installable APK (`Gemini-Summarizer-${{ steps.tag_generator.outputs.TAG_NAME }}.apk`)
            
            #### ✨ Highlights & What's New:
            - **🎙️ Cloudflare Whisper Speech-to-Text & Audio/Video Summarization:**
              - Extract spoken dialogue directly from audio files (`.mp3`, `.wav`, `.m4a`, `.aac`, `.ogg`, `.flac`) and video files (`.mp4`, `.mkv`, `.mov`, `.webm`, `.3gp`).
              - Direct Media URL support: automatically downloads and transcribes remote audio/video links.
              - High accuracy transcription powered by Cloudflare Workers AI `@cf/openai/whisper-large-v3-turbo` with multi-account auto-rotation and quota recovery.
              - Native Android audio extraction and automatic chunking for long media (> 5 minutes).
              - Live speech transcript preview with word count and copy button.
            - **📄 Context-Preserving Hierarchical Summarization:**
              - Seamless long-document summarization (PDF, DOCX, TXT) with rolling context memory.
              - Multi-stage synthesis guaranteeing logical continuity and narrative clarity.
            - **⚡ Multi-Model Cloudflare Workers AI LLM Engine:**
              - Google Gemma 4 26B, Alibaba Qwen 3.8 27B, GPT-OSS 120B, and Llama 3.3 70B Fast.
              - Full priority management, account pool rotation, and Android Keystore AES-256-GCM encryption.
            - **Persistent Official Signature:**
              - Built and signed with the official project release certificate for seamless in-place updates.
          files: |
            release-artifacts/*.apk
            release-artifacts/checksums.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
